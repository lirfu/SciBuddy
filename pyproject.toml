[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools"]

[project]
name = "scibuddy"
version = "0.0.2"
license = "MIT"
description = "SciBuddy contains a bunch of tools used for configurable experiment tracking, advanced logging, elegant data loading and results plotting and much more."
authors = [
    {name = "Juraj Fulir"}
]
maintainers = [
    {name = "Juraj Fulir"}
]
requires-python = ">= 3.8"
readme = {file="readme.md", content-type="text/markdown"}
keywords = ["science", "computer science", "toolkit", "machine learning", "machine vision", "computer vision", "utils", "data", "experiment"]
dependencies = [
    "numpy>=1.22.3",
    "matplotlib>=3.2.2",
    "Pillow>=9.1.0",
    "torch>=1.11.0",
    "torchvision>=0.12.0",
    "tqdm>=4.64.0",
    "trimesh>=3.12.0",
    "opencv-python-headless>=4.5.5.64",
    "pyyaml>=6.0",
    "psutil>=5.9.0",
]

[project.urls]
Repository = "https://github.com/lirfu/SciBuddy"
Issues = "https://github.com/lirfu/SciBuddy/issues"
